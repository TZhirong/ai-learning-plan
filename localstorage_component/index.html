<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
</head>
<body>
<script>
(function () {
  var API_VERSION = 1;

  function send(message) {
    window.parent.postMessage(message, "*");
  }

  function onMessage(event) {
    var msg = event.data;
    if (!msg || msg.type !== "streamlit:render") {
      return;
    }
    var args = (msg.args && typeof msg.args === "object") ? msg.args : {};
    var localKey = args.local_key || "";
    var value = null;
    var error = null;
    try {
      value = localStorage.getItem(localKey);
    } catch (e) {
      error = String(e);
    }
    send({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: { loaded: true, value: value, error: error },
      dataType: "json",
    });
    send({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: 0,
    });
  }

  window.addEventListener("message", onMessage);
  send({
    isStreamlitMessage: true,
    type: "streamlit:componentReady",
    apiVersion: API_VERSION,
  });
})();
</script>
</body>
</html>
